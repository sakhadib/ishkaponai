appId: com.ishkapon.ai
productName: ISHKAPON AI
copyright: Copyright (c) 2026 ISHKAPON

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/{.eslintrc,.prettierrc,.editorconfig,tsconfig*.json,electron.vite.config.ts}'
  - '!**/{.DS_Store,Thumbs.db}'

asar: true

# The scientific wheels (numpy, sympy, mpmath) that the calculation sandbox needs.
#
# These are 7 MB of .whl files that `src/agent/dev/fetch-wheels.mjs` downloads and
# SHA-256 verifies at build time. They are deliberately tracked in git, because a
# packaged build has to ship them and there is no network at run time: the agent
# host points Pyodide at a *local* directory, so a missing wheel is an ENOENT
# rather than a download. That property is the whole reason the sandbox cannot
# fetch remote code, and it only holds if the files are actually there.
#
# The destination name is not free. `wheelDirCandidates()` in src/agent/wheels.ts
# searches, in order: $ISHKAPON_PYODIDE_WHEELS, then
# `join(process.resourcesPath, 'pyodide-packages')`, then the repository
# `src/agent/dev/wheels` (dev only), then the pyodide package dir. In a packaged
# app only the second can match, so `to:` must stay `pyodide-packages`.
#
# `extraResources` and not `asarUnpack`, deliberately. asarUnpack only unpacks
# something already inside the asar; it cannot put a file there. The earlier
# asarUnpack rule for the wheels could never have worked, and because a missing
# wheel directory is not a fatal error - `resolveWheelSource()` reports
# `exists: false` and carries on - the app would have launched, looked healthy,
# and then failed every single calculation. Renaming the folder here breaks the
# build loudly instead.
extraResources:
  - from: src/agent/dev/wheels
    to: pyodide-packages
    filter:
      - '*.whl'

# Pyodide's own runtime (pyodide.asm.wasm, python_stdlib.zip) is loaded by the
# agent host via WebAssembly and read off disk, so it has to be real files rather
# than asar paths. This one is a genuine unpack: the npm package is inside the
# asar as a production dependency, and the WASM loader cannot read through it.
asarUnpack:
  - node_modules/pyodide/**

# ---------------------------------------------------------------------------
# Windows
#
# MSI rather than NSIS, deliberately. The requirement is a *traditional* Windows
# install: double-click, get your own copy, find it in the Start menu and on the
# desktop, and remove it from Control Panel or Settings like any other program.
# MSI is the format Windows itself owns that story for - the installed product
# registers an Uninstall entry, so Apps & features works with no help from us,
# and the install is recorded in the Windows Installer database rather than in a
# private uninstaller of ours. NSIS can be made to imitate that, and does, but it
# is an imitation.
#
# Two installers for one product is worse than one mediocre installer, so NSIS
# and the portable zip are gone rather than kept alongside. `npm run build:win`
# now produces exactly one thing a student is meant to double-click.
# ---------------------------------------------------------------------------
win:
  target:
    - target: msi
      arch: [x64, arm64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

msi:
  # `false` means the assisted installer: a dialog with an Install button and a
  # progress bar, rather than a silent run with no visible UI at all. This is the
  # "traditional" part of the requirement, and it is a deliberate choice against
  # the silent default - a student should see that something is happening.
  oneClick: false

  # Per-user, not per-machine. `false` here means the app installs into the
  # current user's own profile and needs no administrator rights and no UAC
  # prompt, which is what "each user gets their own copy" requires. `true` would
  # put it in Program Files for everyone on the machine and demand elevation.
  perMachine: false

  # Both shortcuts. `createDesktopShortcut: true` creates it on first install and
  # leaves it alone on repair or upgrade, so a student who deletes the icon does
  # not get it back on every update. 'always' would force it back each time.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ISHKAPON AI

  # Pinned rather than left to the default. The default derives this from `appId`
  # with UUID v5, which is stable, but it is stable only for as long as nobody
  # edits appId - and editing appId is exactly the kind of tidy-up that silently
  # leaves every installed copy orphaned beside a second one, with no upgrade path
  # between them. A literal here is auditable in the diff.
  upgradeCode: D0CFF4CA-CD33-44D4-8A1B-DF5B2F416E62

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright (c) 2026 ISHKAPON

dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  window:
    width: 540
    height: 380

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  category: Utility
  synopsis: ISHKAPON AI desktop application
  maintainer: ISHKAPON
  desktop:
    entry:
      Name: ISHKAPON AI
      Comment: ISHKAPON AI desktop application
      Categories: Utility;

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Snap is intentionally not enabled: it requires a connected store account.
# There is no portable Windows build either. An MSI that registers itself with
# Windows is what "a program I installed" means, and a zip that has to be
# unpacked somewhere by hand teaches students the wrong thing about where the app
# came from.
