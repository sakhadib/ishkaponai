appId: com.ishkapon.ai
productName: ISHKAPON AI
copyright: Copyright (c) 2026 ISHKAPON

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/{.eslintrc,.prettierrc,.editorconfig,tsconfig*.json,electron.vite.config.ts}'
  - '!**/{.DS_Store,Thumbs.db}'

asar: true

# The scientific wheels (numpy, sympy, mpmath) that the calculation sandbox needs.
#
# These are 7 MB of .whl files that `src/agent/dev/fetch-wheels.mjs` downloads and
# SHA-256 verifies at build time. They are deliberately tracked in git, because a
# packaged build has to ship them and there is no network at run time: the agent
# host points Pyodide at a *local* directory, so a missing wheel is an ENOENT
# rather than a download. That property is the whole reason the sandbox cannot
# fetch remote code, and it only holds if the files are actually there.
#
# The destination name is not free. `wheelDirCandidates()` in src/agent/wheels.ts
# searches, in order: $ISHKAPON_PYODIDE_WHEELS, then
# `join(process.resourcesPath, 'pyodide-packages')`, then the repository
# `src/agent/dev/wheels` (dev only), then the pyodide package dir. In a packaged
# app only the second can match, so `to:` must stay `pyodide-packages`.
#
# `extraResources` and not `asarUnpack`, deliberately. asarUnpack only unpacks
# something already inside the asar; it cannot put a file there. The earlier
# asarUnpack rule for the wheels could never have worked, and because a missing
# wheel directory is not a fatal error - `resolveWheelSource()` reports
# `exists: false` and carries on - the app would have launched, looked healthy,
# and then failed every single calculation. Renaming the folder here breaks the
# build loudly instead.
extraResources:
  - from: src/agent/dev/wheels
    to: pyodide-packages
    filter:
      - '*.whl'

# Pyodide's own runtime (pyodide.asm.wasm, python_stdlib.zip) is loaded by the
# agent host via WebAssembly and read off disk, so it has to be real files rather
# than asar paths. This one is a genuine unpack: the npm package is inside the
# asar as a production dependency, and the WASM loader cannot read through it.
asarUnpack:
  - node_modules/pyodide/**

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ISHKAPON AI
  deleteAppDataOnUninstall: false

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright (c) 2026 ISHKAPON

dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  window:
    width: 540
    height: 380

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  category: Utility
  synopsis: ISHKAPON AI desktop application
  maintainer: ISHKAPON
  desktop:
    entry:
      Name: ISHKAPON AI
      Comment: ISHKAPON AI desktop application
      Categories: Utility;

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Snap is intentionally not enabled: it requires a connected store account.
# Publish portable Windows builds via the `zip` target above.
