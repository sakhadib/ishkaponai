appId: com.ishkapon.ai
productName: ISHKAPON AI
copyright: Copyright (c) 2026 ISHKAPON

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/{.eslintrc,.prettierrc,.editorconfig,tsconfig*.json,electron.vite.config.ts}'
  - '!**/{.DS_Store,Thumbs.db}'

asar: true

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ISHKAPON AI
  deleteAppDataOnUninstall: false

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Copyright (c) 2026 ISHKAPON

dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  window:
    width: 540
    height: 380

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  category: Utility
  synopsis: ISHKAPON AI desktop application
  maintainer: ISHKAPON
  desktop:
    entry:
      Name: ISHKAPON AI
      Comment: ISHKAPON AI desktop application
      Categories: Utility;

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Snap is intentionally not enabled: it requires a connected store account.
# Publish portable Windows builds via the `zip` target above.
